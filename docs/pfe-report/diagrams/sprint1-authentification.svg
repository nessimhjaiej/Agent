<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #143b6b; }
      .label { font: 600 18px Arial, sans-serif; fill: #1f2937; }
      .text { font: 15px Arial, sans-serif; fill: #334155; }
      .line { stroke: #64748b; stroke-width: 2; }
      .msg { stroke: #111827; stroke-width: 2.2; fill: none; marker-end: url(#m); }
      .msgb { stroke: #2563eb; stroke-width: 2.2; fill: none; marker-end: url(#m2); }
    </style>
    <marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#111827"/></marker>
    <marker id="m2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/></marker>
  </defs>
  <text x="40" y="48" class="title">Sprint 1 - Sequence d'authentification</text>
  <text x="120" y="110" class="label">Utilisateur</text>
  <text x="430" y="110" class="label">Frontend</text>
  <text x="830" y="110" class="label">Supabase Auth</text>
  <text x="1110" y="110" class="label">Admin</text>

  <line x1="170" y1="130" x2="170" y2="650" class="line"/>
  <line x1="500" y1="130" x2="500" y2="650" class="line"/>
  <line x1="910" y1="130" x2="910" y2="650" class="line"/>
  <line x1="1160" y1="130" x2="1160" y2="650" class="line"/>

  <path d="M170 180 L500 180" class="msg"/>
  <text x="300" y="170" class="text">Saisie email / mot de passe</text>
  <path d="M500 240 L910 240" class="msg"/>
  <text x="630" y="230" class="text">signUp / signIn</text>
  <path d="M910 300 L500 300" class="msgb"/>
  <text x="610" y="290" class="text">Session + role + etat</text>
  <path d="M500 360 L170 360" class="msgb"/>
  <text x="250" y="350" class="text">Acces espace utilisateur</text>

  <path d="M1160 460 L500 460" class="msg"/>
  <text x="770" y="450" class="text">Connexion administrateur</text>
  <path d="M500 520 L910 520" class="msg"/>
  <text x="630" y="510" class="text">signInWithPassword</text>
  <path d="M910 580 L500 580" class="msgb"/>
  <text x="650" y="570" class="text">Session admin valide</text>
  <path d="M500 620 L1160 620" class="msgb"/>
  <text x="780" y="610" class="text">Acces tableau de bord admin</text>
</svg>
