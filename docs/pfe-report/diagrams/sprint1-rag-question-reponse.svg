  <text x="470" y="110" class="label">Generation</text>
  <text x="760" y="110" class="label">Retrieval</text>
  <text x="980" y="110" class="label">Weaviate</text>
  <text x="1210" y="110" class="label">LLM</text>

  <line x1="100" y1="130" x2="100" y2="650" class="line"/>
  <line x1="280" y1="130" x2="280" y2="650" class="line"/>
  <line x1="530" y1="130" x2="530" y2="650" class="line"/>
  <line x1="800" y1="130" x2="800" y2="650" class="line"/>
  <line x1="1030" y1="130" x2="1030" y2="650" class="line"/>
  <line x1="1250" y1="130" x2="1250" y2="650" class="line"/>

