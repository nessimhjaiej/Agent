<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #143b6b; }
      .label { font: 600 18px Arial, sans-serif; fill: #1f2937; }
      .text { font: 14px Arial, sans-serif; fill: #334155; }
      .blue { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; }
      .green { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; }
      .purple { fill: #faf5ff; stroke: #a855f7; stroke-width: 2; }
      .orange { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
      .arrow { stroke: #111827; stroke-width: 2.5; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#111827"/></marker>
  </defs>
  <text x="40" y="48" class="title">Sprint 2 - Cycle de vie des documents et des citations</text>
  <rect x="60" y="150" rx="18" ry="18" width="170" height="90" class="blue"/>
  <text x="145" y="195" text-anchor="middle" class="label">Upload</text>
  <text x="145" y="220" text-anchor="middle" class="text">Depot du PDF</text>

  <rect x="290" y="150" rx="18" ry="18" width="170" height="90" class="green"/>
  <text x="375" y="195" text-anchor="middle" class="label">Validation</text>
  <text x="375" y="220" text-anchor="middle" class="text">Controle admin</text>

  <rect x="520" y="150" rx="18" ry="18" width="170" height="90" class="green"/>
  <text x="605" y="195" text-anchor="middle" class="label">Indexation</text>
  <text x="605" y="220" text-anchor="middle" class="text">Preparation recherche</text>

  <rect x="760" y="120" rx="18" ry="18" width="220" height="110" class="purple"/>
  <text x="870" y="165" text-anchor="middle" class="label">Supabase Storage</text>
  <text x="870" y="195" text-anchor="middle" class="text">Fichiers et chemins</text>

  <rect x="760" y="270" rx="18" ry="18" width="220" height="110" class="purple"/>
  <text x="870" y="315" text-anchor="middle" class="label">Supabase DB</text>
  <text x="870" y="345" text-anchor="middle" class="text">Metadonnees et uploader</text>

  <rect x="1040" y="195" rx="18" ry="18" width="220" height="110" class="blue"/>
  <text x="1150" y="240" text-anchor="middle" class="label">Weaviate</text>
  <text x="1150" y="270" text-anchor="middle" class="text">Passages indexes</text>

  <rect x="520" y="450" rx="18" ry="18" width="300" height="110" class="orange"/>
  <text x="670" y="495" text-anchor="middle" class="label">Citations et apercus fiables</text>
  <text x="670" y="525" text-anchor="middle" class="text">Alignement IDs, previews, tracabilite</text>

  <path d="M230 195 L290 195" class="arrow"/>
  <path d="M460 195 L520 195" class="arrow"/>
  <path d="M690 185 L760 175" class="arrow"/>
  <path d="M690 205 L760 325" class="arrow"/>
  <path d="M690 195 L1040 250" class="arrow"/>
  <path d="M870 380 L760 505" class="arrow"/>
  <path d="M1150 305 L820 505" class="arrow"/>
