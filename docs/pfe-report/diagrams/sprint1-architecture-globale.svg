<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #143b6b; }
      .label { font: 600 18px Arial, sans-serif; fill: #1f2937; }
      .text { font: 15px Arial, sans-serif; fill: #334155; }
      .box-blue { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; }
      .box-green { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; }
      .box-orange { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
      .box-purple { fill: #faf5ff; stroke: #a855f7; stroke-width: 2; }
      .arrow { stroke: #111827; stroke-width: 2.5; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#111827"/>
    </marker>
  </defs>
  <text x="40" y="48" class="title">Sprint 1 - Architecture globale de la plateforme</text>

  <rect x="40" y="110" rx="18" ry="18" width="220" height="150" class="box-blue"/>
  <text x="150" y="150" text-anchor="middle" class="label">Utilisateurs</text>
  <text x="150" y="185" text-anchor="middle" class="text">Admin</text>
  <text x="150" y="210" text-anchor="middle" class="text">User</text>

  <rect x="320" y="110" rx="18" ry="18" width="220" height="150" class="box-blue"/>
  <text x="430" y="150" text-anchor="middle" class="label">Frontend</text>
  <text x="430" y="185" text-anchor="middle" class="text">React + Vite</text>
  <text x="430" y="210" text-anchor="middle" class="text">UI utilisateur et admin</text>

  <rect x="600" y="80" rx="20" ry="20" width="460" height="310" class="box-green"/>
  <text x="830" y="120" text-anchor="middle" class="label">Backend microservices</text>

  <rect x="640" y="150" rx="12" ry="12" width="160" height="70" class="box-green"/>
  <text x="720" y="192" text-anchor="middle" class="text">auth-service</text>
  <rect x="830" y="150" rx="12" ry="12" width="190" height="70" class="box-green"/>
  <text x="925" y="192" text-anchor="middle" class="text">ingestion-service</text>
  <rect x="640" y="250" rx="12" ry="12" width="160" height="70" class="box-green"/>
  <text x="720" y="292" text-anchor="middle" class="text">preprocessing-service</text>
  <rect x="830" y="250" rx="12" ry="12" width="190" height="70" class="box-green"/>
  <text x="925" y="292" text-anchor="middle" class="text">embedding-service</text>
  <rect x="640" y="340" rx="12" ry="12" width="160" height="70" class="box-green"/>
  <text x="720" y="382" text-anchor="middle" class="text">retrieval-service</text>
  <rect x="830" y="340" rx="12" ry="12" width="190" height="70" class="box-green"/>
  <text x="925" y="382" text-anchor="middle" class="text">generation-service</text>

  <rect x="1120" y="110" rx="18" ry="18" width="220" height="120" class="box-purple"/>
  <text x="1230" y="150" text-anchor="middle" class="label">Supabase</text>
  <text x="1230" y="180" text-anchor="middle" class="text">Auth + metadonnees</text>

  <rect x="1120" y="270" rx="18" ry="18" width="220" height="120" class="box-purple"/>
  <text x="1230" y="310" text-anchor="middle" class="label">Weaviate</text>
  <text x="1230" y="340" text-anchor="middle" class="text">Base vectorielle</text>

  <rect x="1120" y="430" rx="18" ry="18" width="220" height="120" class="box-orange"/>
  <text x="1230" y="470" text-anchor="middle" class="label">LLM</text>
  <text x="1230" y="500" text-anchor="middle" class="text">OpenAI / Ollama</text>

  <path d="M260 185 L320 185" class="arrow"/>
  <path d="M540 185 L640 185" class="arrow"/>
  <path d="M540 210 L830 210" class="arrow"/>
  <path d="M925 220 L925 250" class="arrow"/>
  <path d="M800 285 L830 285" class="arrow"/>
  <path d="M925 320 L925 340" class="arrow"/>
  <path d="M800 375 L830 375" class="arrow"/>
  <path d="M1020 185 L1120 170" class="arrow"/>
  <path d="M1020 285 L1120 330" class="arrow"/>
  <path d="M1020 375 L1120 490" class="arrow"/>

  <text x="40" y="650" class="label">Lecture</text>
  <text x="40" y="680" class="text">Le frontend dialogue avec l'authentification, l'ingestion et la generation.</text>
  <text x="40" y="705" class="text">Le backend s'appuie sur Supabase pour les metadonnees, Weaviate pour la recherche vectorielle,</text>
  <text x="40" y="730" class="text">et un LLM pour la generation finale de reponses contextualisees.</text>
</svg>
