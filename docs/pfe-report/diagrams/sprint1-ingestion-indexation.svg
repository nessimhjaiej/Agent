<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #143b6b; }
      .label { font: 600 16px Arial, sans-serif; fill: #1f2937; }
      .text { font: 14px Arial, sans-serif; fill: #334155; }
      .line { stroke: #64748b; stroke-width: 2; }
      .msg { stroke: #111827; stroke-width: 2; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#111827"/></marker>
  </defs>
  <text x="40" y="48" class="title">Sprint 1 - Ingestion et indexation documentaire</text>

  <text x="70" y="110" class="label">Admin</text>
  <text x="235" y="110" class="label">Frontend</text>
  <text x="420" y="110" class="label">Ingestion</text>
  <text x="620" y="110" class="label">Supabase</text>
  <text x="800" y="110" class="label">Preprocessing</text>
  <text x="1040" y="110" class="label">Embedding</text>
  <text x="1280" y="110" class="label">Weaviate</text>

  <line x1="90" y1="130" x2="90" y2="660" class="line"/>
  <line x1="260" y1="130" x2="260" y2="660" class="line"/>
  <line x1="450" y1="130" x2="450" y2="660" class="line"/>
  <line x1="650" y1="130" x2="650" y2="660" class="line"/>
  <line x1="850" y1="130" x2="850" y2="660" class="line"/>
  <line x1="1080" y1="130" x2="1080" y2="660" class="line"/>
  <line x1="1310" y1="130" x2="1310" y2="660" class="line"/>

