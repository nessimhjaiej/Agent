openapi: 3.0.3
info:
  title: ingestion-service API
  version: 0.1.0
  description: Contract-first API for document upload, listing, status transitions, signed URLs, and deletion.
servers:
  - url: http://localhost:8005
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ingestion/documents:
    get:
      summary: List documents for a user
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: User documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDocumentsResponse"
        "400":
          description: Invalid request or configuration
        "500":
          description: Internal service error
        "502":
          description: Upstream dependency failure
  /ingestion/documents/upload:
    post:
      summary: Upload a document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [user_id, file]
              properties:
                user_id:
                  type: string
                  minLength: 1
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Uploaded document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400":
          description: Invalid request or configuration
        "422":
          description: Invalid payload
        "500":
          description: Internal service error
        "502":
          description: Upstream dependency failure
  /ingestion/documents/{document_id}/status:
    post:
      summary: Update a document status
      parameters:
        - $ref: "#/components/parameters/DocumentIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentStatusRequest"
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400":
          description: Invalid request
        "404":
          description: Missing configuration or document lookup issue
        "422":
          description: Invalid payload
        "500":
          description: Internal service error
        "502":
          description: Upstream dependency failure
  /ingestion/documents/{document_id}/signed-url:
    get:
      summary: Generate a signed URL for a document
      parameters:
        - $ref: "#/components/parameters/DocumentIdPath"
        - name: expires_in
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Signed URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedUrlResponse"
        "400":
          description: Invalid request
        "404":
          description: Missing configuration or document lookup issue
        "500":
          description: Internal service error
        "502":
          description: Upstream dependency failure
  /ingestion/documents/{document_id}:
    delete:
      summary: Delete a document
      parameters:
        - $ref: "#/components/parameters/DocumentIdPath"
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteDocumentResponse"
        "400":
          description: Invalid request
        "404":
          description: Missing configuration or document lookup issue
        "500":
          description: Internal service error
        "502":
          description: Upstream dependency failure
components:
  parameters:
    DocumentIdPath:
      name: document_id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: ingestion-service
        version:
          type: string
          example: 0.1.0
    DocumentResponse:
      type: object
      required:
        - id
        - user_id
        - original_name
        - storage_path
        - status
        - embedded
        - size_bytes
        - created_at
      properties:
        id:
          type: string
        user_id:
          type: string
        original_name:
          type: string
        storage_path:
          type: string
        status:
          type: string
        embedded:
          type: boolean
        size_bytes:
          type: integer
        created_at:
          type: string
        embedded_at:
          type: string
          nullable: true
    ListDocumentsResponse:
      type: object
      required: [status, documents]
      properties:
        status:
          type: string
          example: ok
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentResponse"
    UpdateDocumentStatusRequest:
      type: object
      required: [target_status]
      properties:
        target_status:
          type: string
          enum: [pending, validated, rejected]
    SignedUrlResponse:
      type: object
      required: [status, document_id, storage_path, signed_url, expires_in]
      properties:
        status:
          type: string
          example: ok
        document_id:
          type: string
        storage_path:
          type: string
        signed_url:
          type: string
        expires_in:
          type: integer
    DeleteDocumentResponse:
      type: object
      required: [status, document_id, storage_path]
      properties:
        status:
          type: string
        document_id:
          type: string
        storage_path:
          type: string
