openapi: 3.0.3
info:
  title: retrieval-service
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /retrieval/search:
    post:
      summary: Retrieval search
      description: Performs bm25/vector/hybrid retrieval, applies fusion, and optional reranking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Retrieval results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "422":
          description: Invalid payload
        "500":
          description: Internal server error

components:
  schemas:
    FusionOptions:
      type: object
      properties:
        type:
          type: string
          enum: [alpha, rrf]
          default: alpha
        alpha:
          type: number
          format: float
          minimum: 0
          maximum: 1
          default: 0.7
        rrf_k:
          type: integer
          minimum: 1
          default: 60

    RerankOptions:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
        type:
          type: string
          enum: [none, cross_encoder, llm_batch]
          default: none
        top_n:
          type: integer
          minimum: 1
          default: 20
        batch_size:
          type: integer
          minimum: 1
          default: 16

    SearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
        mode:
          type: string
          enum: [bm25, vector, hybrid]
          default: hybrid
        top_k_retrieve:
          type: integer
          minimum: 1
          default: 5
        top_k_return:
          type: integer
          minimum: 1
          default: 3
        filters:
          type: object
          additionalProperties: true
        fusion:
          $ref: "#/components/schemas/FusionOptions"
        rerank:
          $ref: "#/components/schemas/RerankOptions"

    SearchChunkResult:
      type: object
      required: [chunk_id, document_id, chunk_text, metadata]
      properties:
        chunk_id: { type: string }
        document_id: { type: string }
        chunk_text: { type: string }
        metadata:
          type: object
          additionalProperties: true
        bm25_score:
          type: number
          nullable: true
        vector_score:
          type: number
          nullable: true
        fusion_score:
          type: number
          nullable: true
        rerank_score:
          type: number
          nullable: true

    SearchDocumentResult:
      type: object
      required: [document_id, chunk_ids, hit_count]
      properties:
        document_id:
          type: string
        chunk_ids:
          type: array
          items: { type: string }
        hit_count:
          type: integer

    SearchResponse:
      type: object
      required:
        - status
        - query
        - mode
        - retrieval_count
        - returned_count
        - fusion_type
        - rerank_type
        - chunks
        - documents
      properties:
        status:
          type: string
          example: ok
        query:
          type: string
        mode:
          type: string
          enum: [bm25, vector, hybrid]
        retrieval_count:
          type: integer
        returned_count:
          type: integer
        fusion_type:
          type: string
        rerank_type:
          type: string
        chunks:
          type: array
          items:
            $ref: "#/components/schemas/SearchChunkResult"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/SearchDocumentResult"
