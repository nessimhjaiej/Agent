services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.35.7
    container_name: weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: "node1"
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    env_file:
      - .env
    ports:
      - "8001:8001"
    restart: unless-stopped

  preprocessing-service:
    build:
      context: .
      dockerfile: services/preprocessing-service/Dockerfile
    container_name: preprocessing-service
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  embedding-service:
    build:
      context: .
      dockerfile: services/embedding-service/Dockerfile
    container_name: embedding-service
    env_file:
      - .env
    ports:
      - "8002:8002"
    depends_on:
      - weaviate
    restart: unless-stopped

  retrieval-service:
    build:
      context: .
      dockerfile: services/retrieval-service/Dockerfile
    container_name: retrieval-service
    env_file:
      - .env
    ports:
      - "8003:8003"
    depends_on:
      - weaviate
    restart: unless-stopped

  generation-service:
    build:
      context: .
      dockerfile: services/generation-service/Dockerfile
    container_name: generation-service
    env_file:
      - .env
    ports:
      - "8004:8004"
    restart: unless-stopped

volumes:
  weaviate_data:
